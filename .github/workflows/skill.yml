name: SoDEX skill

on:
  pull_request:
    paths:
      - skills/**
      - tests/test_skill.py
      - tests/test_skill_cli.py
      - tests/test_trading_metadata.py
      - sodex/**
      - .github/workflows/skill.yml
  push:
    branches: [main]
    paths:
      - skills/**
      - tests/test_skill.py
      - tests/test_skill_cli.py
      - tests/test_trading_metadata.py
      - sodex/**
      - .github/workflows/skill.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
