[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sodex-python-sdk"
version = "0.2.0"
description = "Official Python SDK for the Sodex exchange — EIP-712 signing, REST client, WebSocket client"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "eth-account>=0.10",
    "requests>=2.28",
    "websocket-client>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["sodex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
